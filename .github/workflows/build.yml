name: Build ORXA Cloudstream Extension

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        run: |
          chmod +x gradlew
          ./gradlew OrxaProvider:make

      - name: Upload CS3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: orxa-cloudstream-plugin
          path: "OrxaProvider/build/*.cs3"
          if-no-files-found: error
