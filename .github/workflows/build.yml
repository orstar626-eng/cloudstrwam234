name: Build ORXA Cloudstream Extension

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew OrxaProvider:make --stacktrace

      - name: Upload CS3 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orxa-cloudstream-plugin
          path: 'OrxaProvider/build/*.cs3'
          if-no-files-found: warn
